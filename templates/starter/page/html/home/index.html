<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>此刻</title>
<link rel="stylesheet" href="../../assets/numable.css" />
<script src="../../assets/clock.js" defer></script>
</head>
<body>
  <header class="nb-header">
    <h1 data-copy="title">此刻</h1>
    <p class="nb-sub" data-copy="subtitle">跟随你所在的时区</p>
  </header>
  <main>
    <section class="nb-card" aria-labelledby="clock-label">
      <h2 class="nb-label" id="clock-label" data-copy="now">当地时间</h2>
      <p class="nb-metric" id="time">--:--</p>
      <p class="nb-sub" id="date">--</p>
    </section>
    <section class="nb-section" aria-labelledby="details-label">
      <div class="nb-section-head"><h2 id="details-label" data-copy="details">今天</h2></div>
      <div class="nb-card">
        <div class="nb-row"><span class="nb-row-label" data-copy="weekday">星期</span><span class="nb-row-value" id="weekday">--</span></div>
        <div class="nb-row"><span class="nb-row-label" data-copy="zone">时区</span><span class="nb-row-value" id="zone">--</span></div>
      </div>
    </section>
    <div class="nb-actions" id="app-actions" hidden>
      <button class="nb-button" type="button" id="add-widget" data-copy="add">添加组件</button>
    </div>
    <p class="nb-sub nb-error" id="error" data-copy="error" role="status" hidden></p>
  </main>
  <footer class="nb-footnote" data-copy="privacy">使用设备时间，无需联网。</footer>
</body>
</html>
